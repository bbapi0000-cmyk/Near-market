<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Near Market - Seller Center</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f7fb;
      color:#172033
    }

    header{
      background:white;
      padding:15px;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 2px 10px #0001
    }

    .top{
      max-width:900px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center
    }

    .logo{
      font-size:23px;
      font-weight:800;
      color:#1769e0
    }

    main{
      max-width:900px;
      margin:auto;
      padding:16px
    }

    .card{
      background:white;
      padding:20px;
      border-radius:16px;
      margin-bottom:18px;
      box-shadow:0 2px 10px #0001
    }

    input,textarea,select{
      width:100%;
      padding:13px;
      margin:7px 0;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:15px
    }

    textarea{
      min-height:100px;
      resize:vertical
    }

    button{
      border:0;
      border-radius:10px;
      padding:12px 16px;
      cursor:pointer;
      font-size:14px
    }

    .primary{
      background:#1769e0;
      color:white
    }

    .danger{
      background:#ffe8e8;
      color:#d00
    }

    .message{
      margin-top:10px;
      font-size:14px
    }

    .product{
      border:1px solid #eee;
      border-radius:12px;
      padding:12px;
      margin-top:12px
    }

    .product img{
      width:100%;
      max-height:220px;
      object-fit:cover;
      border-radius:10px;
      margin-bottom:10px
    }

    .price{
      font-size:18px;
      font-weight:bold;
      color:#16803c
    }

    .hidden{
      display:none
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <div class="logo">
      Near Market 🏪 Seller
    </div>

    <button onclick="goHome()">
      Home
    </button>

  </div>
</header>


<main>

  <!-- LOGIN MESSAGE -->

  <div
    id="loginBox"
    class="card">

    <h2>🔐 Seller Login</h2>

    <p>
      Seller Center ব্যবহার করতে আগে Near Market account-এ login করুন।
    </p>

    <button
      class="primary"
      onclick="goHome()">
      Go to Login
    </button>

  </div>


  <!-- SELLER DASHBOARD -->

  <div
    id="sellerDashboard"
    class="hidden">

    <div class="card">

      <h2>🏪 My Shop</h2>

      <div id="userInfo"></div>

      <input
        id="shopName"
        placeholder="Shop name">

      <input
        id="shopPhone"
        placeholder="Shop mobile number">

      <input
        id="shopArea"
        placeholder="Shop area">

      <textarea
        id="shopDescription"
        placeholder="Shop description"></textarea>

      <button
        class="primary"
        onclick="saveShop()">
        💾 Save Shop
      </button>

      <div
        id="shopMessage"
        class="message">
      </div>

    </div>


    <!-- ADD PRODUCT -->

    <div class="card">

      <h2>➕ Add Product</h2>

      <input
        id="productName"
        placeholder="Product name">

      <input
        id="productCategory"
        placeholder="Category">

      <input
        id="productPrice"
        type="number"
        min="0"
        placeholder="Price ₹">

      <input
        id="productStock"
        type="number"
        min="0"
        placeholder="Stock quantity">

      <input
        id="productImage"
        placeholder="Product image URL">

      <textarea
        id="productDescription"
        placeholder="Product description"></textarea>

      <button
        class="primary"
        onclick="addProduct()">
        🚀 Publish Product
      </button>

      <div
        id="productMessage"
        class="message">
      </div>

    </div>


    <!-- MY PRODUCTS -->

    <div class="card">

      <h2>📦 My Products</h2>

      <div id="myProducts">
        Loading...
      </div>

    </div>

  </div>

</main>


<script>

/* =====================================
   SUPABASE
   ===================================== */

const SUPABASE_URL =
"https://jbyuvpbywdyqugjcsrtj.supabase.co";


/*
  এখানে তোমার নতুন PUBLISHABLE KEY বসাবে।

  Secret key কখনো এখানে বসাবে না।
*/

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_6CQkH8Bz9_4PkBbwxPGU0w_aoj7VBJb";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================
   HOME
   ===================================== */

function goHome(){

  window.location.href =
    "index.html";

}


/* =====================================
   CHECK LOGIN
   ===================================== */

async function checkLogin(){

  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    document
      .getElementById("loginBox")
      .classList
      .remove("hidden");

    return;
  }


  document
    .getElementById("loginBox")
    .classList
    .add("hidden");


  document
    .getElementById("sellerDashboard")
    .classList
    .remove("hidden");


  document
    .getElementById("userInfo")
    .innerHTML =
      "📧 " + escapeHtml(user.email);


  await loadShop(user.id);

}


/* =====================================
   LOAD SHOP
   ===================================== */

async function loadShop(userId){

  const {data,error} =
    await supabaseClient
      .from("sellers")
      .select("*")
      .eq("user_id",userId)
      .maybeSingle();


  if(error){

    console.log(
      "Seller:",
      error.message
    );

    return;
  }


  if(data){

    document
      .getElementById("shopName")
      .value =
        data.shop_name || "";

    document
      .getElementById("shopPhone")
      .value =
        data.phone || "";

    document
      .getElementById("shopArea")
      .value =
        data.area || "";

    document
      .getElementById("shopDescription")
      .value =
        data.description || "";


    await loadMyProducts(data.id);

  }

}


/* =====================================
   SAVE SHOP
   ===================================== */

async function saveShop(){

  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    goHome();

    return;
  }


  const shopName =
    document
      .getElementById("shopName")
      .value
      .trim();


  const message =
    document
      .getElementById("shopMessage");


  if(!shopName){

    message.innerText =
      "Shop name দিন।";

    return;
  }


  /*
    প্রথমে seller আছে কিনা দেখি
  */

  const {data:existing,error:checkError} =
    await supabaseClient
      .from("sellers")
      .select("id")
      .eq("user_id",user.id)
      .maybeSingle();


  if(checkError){

    message.innerText =
      "❌ " + checkError.message;

    return;
  }


  const sellerData = {

    user_id:user.id,

    shop_name:shopName,

    phone:
      document
        .getElementById("shopPhone")
        .value
        .trim(),

    area:
      document
        .getElementById("shopArea")
        .value
        .trim(),

    description:
      document
        .getElementById("shopDescription")
        .value
        .trim()

  };


  let result;


  if(existing){

    result =
      await supabaseClient
        .from("sellers")
        .update(sellerData)
        .eq("id",existing.id);

  }else{

    result =
      await supabaseClient
        .from("sellers")
        .insert(sellerData);

  }


  if(result.error){

    message.innerText =
      "❌ " + result.error.message;

    return;
  }


  message.innerText =
    "✅ Shop saved successfully.";


  const {data:seller} =
    await supabaseClient
      .from("sellers")
      .select("id")
      .eq("user_id",user.id)
      .maybeSingle();


  if(seller){

    await loadMyProducts(seller.id);

  }

}


/* =====================================
   ADD PRODUCT
   ===================================== */

async function addProduct(){

  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    alert("আগে Login করুন।");

    goHome();

    return;
  }


  const message =
    document
      .getElementById("productMessage");


  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const category =
    document
      .getElementById("productCategory")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const stock =
    Number(
      document
        .getElementById("productStock")
        .value
    );


  const imageUrl =
    document
      .getElementById("productImage")
      .value
      .trim();


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  if(!name){

    message.innerText =
      "Product name দিন।";

    return;
  }


  if(!Number.isFinite(price) || price < 0){

    message.innerText =
      "সঠিক price দিন।";

    return;
  }


  if(!Number.isFinite(stock) || stock < 0){

    message.innerText =
      "সঠিক stock দিন।";

    return;
  }


  /*
    Seller খুঁজে বের করা
  */

  const {data:seller,error:sellerError} =
    await supabaseClient
      .from("sellers")
      .select("id")
      .eq("user_id",user.id)
      .maybeSingle();


  if(sellerError){

    message.innerText =
      "❌ " + sellerError.message;

    return;
  }


  if(!seller){

    message.innerText =
      "আগে Shop Save করুন।";

    return;
  }


  /*
    Product insert
  */

  const {error} =
    await supabaseClient
      .from("products")
      .insert({

        seller_id:seller.id,

        name:name,

        description:description,

        price:price,

        stock:stock,

        category:category,

        image_url:imageUrl

      });


  if(error){

    message.innerText =
      "❌ " + error.message;

    return;
  }


  message.innerText =
    "✅ Product published successfully!";


  /*
    Form clear
  */

  document
    .getElementById("productName")
    .value="";

  document
    .getElementById("productCategory")
    .value="";

  document
    .getElementById("productPrice")
    .value="";

  document
    .getElementById("productStock")
    .value="";

  document
    .getElementById("productImage")
    .value="";

  document
    .getElementById("productDescription")
    .value="";


  await loadMyProducts(seller.id);

}


/* =====================================
   MY PRODUCTS
   ===================================== */

async function loadMyProducts(sellerId){

  const area =
    document
      .getElementById("myProducts");


  const {data,error} =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("seller_id",sellerId)
      .order("created_at",{ascending:false});


  if(error){

    area.innerHTML =
      "❌ " + escapeHtml(error.message);

    return;
  }


  if(!data || data.length===0){

    area.innerHTML =
      "<p>এখনও কোনো product add করা হয়নি।</p>";

    return;
  }


  area.innerHTML =
    data.map(product => {

      const image =
        product.image_url
          ? `
            <img
              src="${escapeHtml(product.image_url)}"
              alt="${escapeHtml(product.name || "Product")}"
              onerror="this.style.display='none'">
          `
          : "";


      return `
        <div class="product">

          ${image}

          <h3>
            ${escapeHtml(product.name || "Product")}
          </h3>

          <div class="price">
            ₹${escapeHtml(product.price ?? "0")}
          </div>

          <p>
            Category:
            ${escapeHtml(product.category || "-")}
          </p>

          <p>
            Stock:
            ${escapeHtml(product.stock ?? "0")}
          </p>

          <p>
            ${escapeHtml(product.description || "")}
          </p>

        </div>
      `;

    }).join("");

}


/* =====================================
   ESCAPE HTML
   ===================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================
   START
   ===================================== */

checkLogin();

</script>

</body>
</html>
