<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Near Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f7fb;
      color:#172033
    }
    header{
      background:#fff;
      padding:15px;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 2px 10px #0001
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center
    }
    .logo{
      font-size:25px;
      font-weight:800;
      color:#1769e0
    }
    .location{
      font-size:12px;
      color:#777
    }
    button{
      border:0;
      border-radius:9px;
      padding:10px 14px;
      cursor:pointer
    }
    .primary{
      background:#1769e0;
      color:#fff
    }
    .search{
      width:100%;
      margin-top:12px;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:15px
    }
    main{
      max-width:1000px;
      margin:auto;
      padding:16px
    }
    .hero{
      background:#1769e0;
      color:white;
      padding:24px;
      border-radius:20px;
      margin-bottom:20px
    }
    .hero h1{margin:0 0 8px}
    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px
    }
    .cat{
      background:#fff;
      padding:15px 5px;
      text-align:center;
      box-shadow:0 2px 8px #0001
    }
    .cat span{
      display:block;
      font-size:26px;
      margin-bottom:5px
    }
    .card{
      background:#fff;
      padding:18px;
      border-radius:15px;
      margin-top:15px;
      box-shadow:0 2px 8px #0001
    }
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:#0008;
      z-index:100;
      align-items:center;
      justify-content:center;
      padding:15px
    }
    .box{
      width:100%;
      max-width:420px;
      background:#fff;
      border-radius:18px;
      padding:20px
    }
    input,select{
      width:100%;
      padding:12px;
      margin:7px 0;
      border:1px solid #ddd;
      border-radius:9px
    }
    .close{
      float:right;
      background:#eee
    }
    .hidden{display:none}
    #message{
      margin-top:10px;
      font-size:14px
    }
    @media(max-width:600px){
      .grid{grid-template-columns:repeat(4,1fr)}
      .cat{font-size:11px}
      .cat span{font-size:22px}
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div>
      <div class="logo">Near Market</div>
      <div class="location">📍 South Dinajpur</div>
    </div>

    <button id="authButton" class="primary" onclick="openAuth()">
      Login
    </button>
  </div>

  <input
    class="search"
    placeholder="🔍 Product, shop, service খুঁজুন..."
  >
</header>

<main>

  <section class="hero">
    <h1>সবকিছু কাছাকাছি</h1>
    <p>
      South Dinajpur-এর Local Marketplace।
      Shopping, Used Items, Food, Repair, Services ও Jobs।
    </p>

    <button class="primary" onclick="openAuth()">
      Join Near Market
    </button>
  </section>

  <h2>Categories</h2>

  <div class="grid">

    <button class="cat">
      <span>🛍️</span>Shopping
    </button>

    <button class="cat">
      <span>♻️</span>Used
    </button>

    <button class="cat">
      <span>🍔</span>Food
    </button>

    <button class="cat">
      <span>🔧</span>Repair
    </button>

    <button class="cat">
      <span>👨‍🔧</span>Service
    </button>

    <button class="cat">
      <span>👷</span>Workers
    </button>

    <button class="cat">
      <span>💼</span>Jobs
    </button>

    <button class="cat">
      <span>🏪</span>Shops
    </button>

  </div>

  <div id="profileSection" class="card hidden">
    <h2>👤 My Profile</h2>

    <input id="fullName" placeholder="আপনার নাম">

    <input id="phone" placeholder="Mobile number">

    <input id="area" placeholder="Area / Village">

    <input id="address" placeholder="Full address">

    <input id="pincode" placeholder="Pincode">

    <button class="primary" onclick="saveProfile()">
      Save Profile
    </button>

    <button onclick="logout()">
      Logout
    </button>

    <div id="profileMessage"></div>
  </div>

  <div class="card">
    <h2>💵 Cash on Delivery</h2>
    <p>
      Near Market-এ product order করে delivery-এর সময়
      Cash on Delivery দেওয়া যাবে।
    </p>
  </div>

</main>


<!-- AUTH MODAL -->

<div id="authModal" class="modal">

  <div class="box">

    <button class="close" onclick="closeAuth()">✕</button>

    <h2 id="authTitle">Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      id="loginBtn"
      class="primary"
      onclick="login()"
    >
      Login
    </button>

    <button
      id="signupBtn"
      onclick="signup()"
    >
      Create Account
    </button>

    <div id="message"></div>

  </div>

</div>


<script>

/* ================================
   SUPABASE CONFIG
   ================================ */

const SUPABASE_URL =
"https://jbyuvpbywdyqugjcsrtj.supabase.co";

/*
  এখানে নিজের Supabase
  PUBLISHABLE KEY বসাও।

  Secret key কখনো এখানে দেবে না।
*/

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_z22u79vz68l9OnIgotE3xg_OHzvvL86";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* ================================
   AUTH UI
   ================================ */

function openAuth(){
  document.getElementById("authModal").style.display="flex";
}

function closeAuth(){
  document.getElementById("authModal").style.display="none";
}


/* ================================
   SIGN UP
   ================================ */

async function signup(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if(!email || !password){
    message.innerText =
      "Email এবং password দিন।";
    return;
  }

  if(password.length < 6){
    message.innerText =
      "Password কমপক্ষে 6 characters হতে হবে।";
    return;
  }

  const {data,error} =
    await supabaseClient.auth.signUp({
      email:email,
      password:password
    });

  if(error){
    message.innerText =
      error.message;
    return;
  }

  message.innerText =
    "Account তৈরি হয়েছে। Email verification চাইলে email check করুন।";

}


/* ================================
   LOGIN
   ================================ */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){
    message.innerText =
      error.message;
    return;
  }

  message.innerText =
    "Login successful!";

  closeAuth();

  await loadProfile();

}


/* ================================
   LOGOUT
   ================================ */

async function logout(){

  await supabaseClient.auth.signOut();

  document
    .getElementById("profileSection")
    .classList.add("hidden");

  document
    .getElementById("authButton")
    .innerText="Login";

}


/* ================================
   PROFILE
   ================================ */

async function loadProfile(){

  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();

  if(!user){
    return;
  }

  document
    .getElementById("profileSection")
    .classList.remove("hidden");

  document
    .getElementById("authButton")
    .innerText="My Profile";

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  if(data){

    document.getElementById("fullName").value =
      data.full_name || "";

    document.getElementById("phone").value =
      data.phone || "";

    document.getElementById("area").value =
      data.area || "";

    document.getElementById("address").value =
      data.address || "";

    document.getElementById("pincode").value =
      data.pincode || "";

  }

}


/* ================================
   SAVE PROFILE
   ================================ */

async function saveProfile(){

  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();

  if(!user){
    alert("আগে Login করুন।");
    return;
  }

  const profile = {

    id:user.id,

    full_name:
      document.getElementById("fullName").value,

    phone:
      document.getElementById("phone").value,

    email:user.email,

    district:"Dakshin Dinajpur",

    area:
      document.getElementById("area").value,

    address:
      document.getElementById("address").value,

    pincode:
      document.getElementById("pincode").value

  };

  const {error} =
    await supabaseClient
      .from("profiles")
      .upsert(profile);

  const msg =
    document.getElementById("profileMessage");

  if(error){

    msg.innerText =
      error.message;

  }else{

    msg.innerText =
      "✅ Profile saved successfully.";

  }

}


/* ================================
   CHECK LOGIN ON START
   ================================ */

supabaseClient.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){
      await loadProfile();
    }

  }
);

</script>

</body>
        </html>
